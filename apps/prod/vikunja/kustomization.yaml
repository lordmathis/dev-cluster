apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vikunja

resources:
  - ../../base/vikunja
  - release.yaml
  - ingress.yaml
  - oidc-secret.enc.yaml

configMapGenerator:
  - name: vikunja-prod-values
    namespace: vikunja
    files:
      - values.yaml

configurations:
  - kustomizeconfig.yaml