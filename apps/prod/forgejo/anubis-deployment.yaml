apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anubis
  template:
    metadata:
      labels:
        app: anubis
    spec:
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.27.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: TARGET
              value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: anubis-key
                  key: ED25519_PRIVATE_KEY_HEX
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: anubis
  namespace: forgejo
spec:
  selector:
    app: anubis
  ports:
    - name: http
      port: 8080
      targetPort: http
